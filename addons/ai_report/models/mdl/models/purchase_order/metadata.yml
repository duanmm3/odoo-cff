name: purchase_order
table_reference:
  catalog: ""
  schema: public
  table: purchase_order
columns:
  - name: id
    type: INTEGER
    is_calculated: false
    not_null: true
    is_primary_key: true
  - name: name
    type: VARCHAR
    description: "采购订单编号"
  - name: partner_id
    type: INTEGER
    description: "供应商ID"
  - name: date_order
    type: DATE
    description: "采购订单日期"
  - name: state
    type: VARCHAR
    description: "订单状态: draft/sent/purchase/done/cancel"
  - name: amount_total
    type: DECIMAL
    description: "订单总额"
  - name: user_id
    type: INTEGER
    description: "采购人员ID"
primary_key: id
properties:
  description: "Odoo 采购订单主表"
  module: purchase